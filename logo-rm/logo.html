<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R.M. Logo</title>
    <style>
        .rm-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #684FFF 0%, #8B5CF6 100%);
            border-radius: 50%;
            color: white;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            font-size: 18px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 2px 10px rgba(104, 79, 255, 0.3);
        }
        
        .rm-logo:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(104, 79, 255, 0.4);
        }
        
        /* Alternative style - more minimal */
        .rm-logo-minimal {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            background: #684FFF;
            border-radius: 50%;
            color: white;
            font-family: 'Arial', sans-serif;
            font-weight: 700;
            font-size: 16px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .rm-logo-minimal:hover {
            background: #5A3FD8;
            transform: scale(1.02);
        }
        
        /* Square version */
        .rm-logo-square {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background: #684FFF;
            border-radius: 8px;
            color: white;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            font-size: 16px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .rm-logo-square:hover {
            background: #5A3FD8;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h2>R.M. Logo Options:</h2>
    
    <h3>1. Gradient Circle (Recommended)</h3>
    <a href="#" class="rm-logo">R.M.</a>
    
    <h3>2. Minimal Circle</h3>
    <a href="#" class="rm-logo-minimal">R.M.</a>
    
    <h3>3. Square Version</h3>
    <a href="#" class="rm-logo-square">R.M.</a>
    
    <h3>4. Simple Text</h3>
    <a href="#" style="color: #684FFF; font-weight: bold; font-size: 24px; text-decoration: none;">R.M.</a>
</body>
</html>
